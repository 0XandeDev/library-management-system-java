name: CI

on:
  push:
    branches:
      - main
      - improvements/auto-update
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build and Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: [17]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Run Ant build
        run: ant -f build.xml clean

      - name: Run Maven tests
        run: mvn -q test

      - name: Run static analysis
        run: mvn -q spotbugs:check checkstyle:check
